# SPRC_DeCo Configuration
# Spatial Grid Prompts for Composed Image Retrieval

model:
  arch: sprc_deco
  model_type: pretrain
  load_finetuned: False
  load_pretrained: True

  pretrained: "https://storage.googleapis.com/sfr-vision-language-research/LAVIS/models/BLIP2/blip2_pretrained.pth"
  finetuned: ""

  # Vision Encoder (EVA-CLIP-G)
  vit_model: "eva_clip_g"
  image_size: 224
  drop_path_rate: 0
  use_grad_checkpoint: False
  vit_precision: "fp16"
  freeze_vit: True

  # DeCo Spatial Grid Settings
  grid_size: 8  # 8x8 = 64 spatial tokens
  
  # BERT Fusion Settings
  cross_attention_freq: 2  # Cross-attention frequency in Q-former BERT
  
  # Text settings
  max_txt_len: 32
  
  # Embedding dimension for contrastive learning
  embed_dim: 256


preprocess:
    vis_processor:
        train:
          name: "blip_image_train"
          image_size: 224
        eval:
          name: "blip_image_eval"
          image_size: 224
    text_processor:
        train:
          name: "blip_caption"
        eval:
          name: "blip_caption"

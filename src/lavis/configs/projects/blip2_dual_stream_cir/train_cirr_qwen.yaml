# 双流架构 CIR 模型训练配置 - 使用 Qwen2.5-VL
# 
# 此配置使用 Qwen2.5-VL 作为语义理解流，能够理解抽象指令如"镜像图片"
#
# 使用方法:
#   python train.py --cfg configs/projects/blip2_dual_stream_cir/train_cirr_qwen.yaml
#
# 显存需求:
#   - qwen2.5-vl-3b (冻结): ~12GB
#   - qwen2.5-vl-7b (冻结): ~20GB
#   - 建议使用 A100 40GB 或更高
#
# 对比实验:
#   轻量级: python train.py --cfg .../train_cirr.yaml model.semantic_model_type=lightweight
#   Qwen2-VL: python train.py --cfg .../train_cirr_qwen.yaml

model:
  arch: blip2_dual_stream_cir
  
  # 基础模型配置
  vit_model: "eva_clip_g"
  image_size: 224
  drop_path_rate: 0
  use_grad_checkpoint: True  # 启用梯度检查点节省显存
  vit_precision: "fp16"
  freeze_vit: True
  
  # Q-Former 配置
  num_query_token: 32
  cross_attention_freq: 2
  
  # 预训练权重
  pretrained: "https://storage.googleapis.com/sfr-vision-language-research/LAVIS/models/BLIP2/blip2_pretrained.pth"
  
  # 输出配置
  embed_dim: 256
  max_txt_len: 32
  
  # ====================================
  # 双流架构配置 - 使用 Qwen2.5-VL
  # ====================================
  use_semantic_stream: True
  use_fusion_module: True
  fusion_type: "cross_attention"
  
  # ====== 语义流: Qwen2.5-VL ======
  semantic_model_type: "qwen2_vl"
  
  # Qwen 模型选择 (根据显存选择):
  # - qwen2.5-vl-3b: 推荐，显存需求适中
  # - qwen2-vl-2b: 最小，适合显存有限的情况
  # - qwen2.5-vl-7b: 最强，但需要更多显存
  qwen_model_name: "qwen2.5-vl-3b"
  
  # VLM 设置
  freeze_vlm: True           # 冻结 VLM (必须 True，否则显存不够)
  use_vlm_image_input: True  # 使用图像输入 (多模态理解)
  
  semantic_hidden_dim: 768
  
  # 融合模块参数
  num_fusion_layers: 2
  fusion_heads: 8
  fusion_dropout: 0.1
  
  # 查询生成参数
  query_aggregation: "attention"


datasets:
  cirr:
    vis_processor:
      train:
        name: "blip_image_train"
        image_size: 224
      eval:
        name: "blip_image_eval"
        image_size: 224
    text_processor:
      train:
        name: "blip_caption"
      eval:
        name: "blip_caption"


run:
  task: cir
  
  # 优化器配置 (使用更小的学习率，因为模型更大)
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 5e-6       # 比轻量级版本小
  min_lr: 1e-7
  warmup_lr: 1e-7
  warmup_steps: 500
  weight_decay: 0.05
  max_epoch: 10
  
  # 批次大小 (根据显存调整)
  batch_size_train: 16  # 比轻量级版本小
  batch_size_eval: 32
  num_workers: 4
  
  # 分布式训练
  accum_grad_iters: 2   # 累积梯度
  
  # 混合精度
  amp: True
  
  # 评估配置
  evaluate: False
  valid_splits: ["val"]
  
  # 保存配置
  output_dir: "output/blip2_dual_stream_cir_qwen/cirr"
  
  # 日志
  log_freq: 50
  
  # 设备
  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
  
  # 种子
  seed: 42




